<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Redesign</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fc;
            color: #333;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            margin: 20px;
        }
        .card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin: 10px;
            padding: 20px;
            width: calc(30% - 40px);
            transition: box-shadow 0.3s;
        }
        .card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        h1 {
            color: #4a90e2;
        }
        .chart {
            width: 100%;
            height: 200px;
            background-color: #e7f3ff;
            border-radius: 8px;
            margin-top: 10px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Card Title 1</h1>
            <div class="chart">Chart Placeholder 1</div>
            <p>Some content here describing the first card.</p>
        </div>
        <div class="card">
            <h1>Card Title 2</h1>
            <div class="chart">Chart Placeholder 2</div>
            <p>Some content here describing the second card.</p>
        </div>
        <div class="card">
            <h1>Card Title 3</h1>
            <div class="chart">Chart Placeholder 3</div>
            <p>Some content here describing the third card.</p>
        </div>
    </div>
    <div class="footer">
        <p>&copy; 2026 Carbon Middle Management Inc.</p>
    </div>
</body>
</html>
